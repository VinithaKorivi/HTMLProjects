<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Example</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Bootstrap Card Example</h2>

        <div class="row">
            <!-- Card 1 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="https://up.yimg.com/ib/th/id/OIP.Q5ru_cO9aghBObUCVzo74gHaE7?pid=Api&rs=1&c=1&qlt=95&w=153&h=102" class="card-img-top" alt="Image">
                    <div class="card-body">
                        <h5 class="card-title">Card Title 1</h5>
                        <p class="card-text">This is a simple Bootstrap card example.</p>
                        <a href="#" class="btn btn-primary">Click Me</a>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="https://up.yimg.com/ib/th/id/OIP.Q5ru_cO9aghBObUCVzo74gHaE7?pid=Api&rs=1&c=1&qlt=95&w=153&h=102" class="card-img-top" alt="Image">
                    <div class="card-body">
                        <h5 class="card-title">Card Title 2</h5>
                        <p class="card-text">Bootstrap makes responsive design easy.</p>
                        <a href="#" class="btn btn-success">Click Me</a>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="https://up.yimg.com/ib/th/id/OIP.Q5ru_cO9aghBObUCVzo74gHaE7?pid=Api&rs=1&c=1&qlt=95&w=153&h=102" class="card-img-top" alt="Image">
                    <div class="card-body">
                        <h5 class="card-title">Card Title 3</h5>
                        <p class="card-text">You can create layouts quickly.</p>
                        <a href="#" class="btn btn-danger">Click Me</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
