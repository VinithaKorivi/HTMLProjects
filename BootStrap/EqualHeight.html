<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
}

.column {
  flex: 1;
  padding: 20px;
  border: 1px solid black;
}

.col1 { background-color: lightcoral; }
.col2 { background-color: lightblue; }
.col3 { background-color: lightgreen; }
</style>
</head>
<body>

<div class="container">
  <div class="column col1">Short content</div>
  <div class="column col2">This is a bit longer content to show equal height effect</div>
  <div class="column col3">Medium content here</div>
  <p>This is related to equal coiumns</p>
</div>

</body>
</html>
