<!DOCTYPE html>
<html>
<head>
    <style>
        h1 {
            color: blue;
        }
        .highlight {
            color: green;
            font-weight: bold;
        }

        #special {
            color: red;
        }
        p, span {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Welcome to CSS Selectors</h1>

    <p>This is a normal paragraph.</p>

    <p class="highlight">This paragraph uses class selector.</p>

    <p id="special">This paragraph uses ID selector.</p>

    <span>This is a span element.</span>

</body>
</html>
