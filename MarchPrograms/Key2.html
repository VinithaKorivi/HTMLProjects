<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 100px;
  height: 100px;
  background: blue;
  margin: 100px;
  animation: rotateBox 2s linear infinite;
}

@keyframes rotateBox {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
