<html>
    <head>
        <style>
           .container{
           display: grid;
           grid-template-columns: repeat(autofix,minmax(250px,1fr));
           padding: 10px;
           gap: 20px;
           }
           .label{
            background: cyan;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px red;
           }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="label"><p>Java full stack Developer</p><h1>Vinitha</h1></div>
            <div class="label"><p>Python full stack Developer</p><h1>Jeevitha</h1></div>
            <div class="label"><p>Cloud  Developer</p><h1>Bavya</h1></div>
        </div>
    </body>
</html>
