<!DOCTYPE html>
<html>
<head>
<title>Button Style</title>
<style>
body{
text-align:center;
margin-top:100px;
}
button{
background-color:green;
color:white;
padding:15px 30px;
border:none;
font-size:18px;
cursor:pointer;
}
button:hover{
background-color:darkgreen;
}
</style>
</head>
<body>
<button>Click Me</button>
</body>
</html>
