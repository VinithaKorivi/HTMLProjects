<!DOCTYPE html>
<html>
<head>
<style>
.car {
  width: 100px;
  height: 50px;
  background: green;
  position: relative;
  animation: moveCar 4s linear infinite;
}

@keyframes moveCar {
  0%   { left: 0; }
  100% { left: 300px; }
}
</style>
</head>
<body>

<div class="car"></div>

</body>
</html>
