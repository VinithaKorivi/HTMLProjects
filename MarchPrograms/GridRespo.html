<html>
<head>
<style>
.container{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  grid-template-columns: repeat(autofix, minmax(200px,1fr));
  gap: 20px;
  padding:20px;
}

.box{
  background-color: cyan;
  padding:40px;
  text-align:center;
  font-size:20px;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">1</div>
  <div class="box">2</div>
  <div class="box">3</div>
  <div class="box">4</div>
  <div class="box">5</div>
  <div class="box">6</div>
</div>

</body>
</html>
