<html>
    <head>
        <style>
          .container{
            display: grid;
            background: cyan;
            grid-auto-rows: 100px;
            grid-template-columns: repeat(autofix,3,100px);
            grid-template-rows: repeat(autofix,3,100px);
            gap: 10px;
          }  
          .container div{
            background: blue;
          }
          .a,.b{
          grid-column: 1/4;
          }
        </style>
    </head>
    <body><div class="container">
     <div class="a">1</div>
     <div >2</div>
     <div >3</div>
     <div >4</div>
     <div class="b">5</div>
     <div >6</div>
     <div>7</div>
     <div >8</div>
     <div>9</div>
     <div >10</div>  
     </div>
    </body>
</html>
