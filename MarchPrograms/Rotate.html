<html>
    <head>
        <style>
            *{
box-sizing:border-box;
}
            body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    perspective:800px;
      }
         div{
            color: black;
            background-color: rgb(18, 210, 18);
            width: 300px;
            height: 200px;
            margin: 100px;
            text-align: center;
            line-height: 200px;
            transition: all 3s linear 0s;
         }
         div:hover{
            transform:rotatex(180deg) translateZ(100px);
}
        </style>
    </head>
    <body>
        <div>Rotate</div>
    </body>
</html>
