<!DOCTYPE html>
<html>
<head>
<style>
.text {
  font-size: 30px;
  text-align: center;
  margin-top: 100px;
  animation: fade 3s infinite;
}

@keyframes fade {
  0%   { opacity: 0; }
  50%  { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>

<div class="text">Hello World</div>

</body>
</html>
