<html>
<head>
<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    perspective:800px;
}

.cube{
    width:200px;
    height:200px;
    position:relative;
    transform-style:preserve-3d;
    animation:rotate 10s 2 linear;
}

.face{
    position:absolute;
    width:200px;
    height:200px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    color:white;
}

/* Faces */

.front{
    background:red;
    transform:translateZ(100px);
}

.back{
    background:blue;
    transform:rotateY(180deg) translateZ(100px);
}

.left{
    background:green;
    transform:rotateY(-90deg) translateZ(100px);
}

.right{
    background:orange;
    transform:rotateY(90deg) translateZ(100px);
}

.top{
    background:purple;
    transform:rotateX(90deg) translateZ(100px);
}

.bottom{
    background:brown;
    transform:rotateX(-90deg) translateZ(100px);
}

/* Animation */

@keyframes rotate{
    from{
        transform:rotateX(0deg) rotateY(0deg);
    }
    to{
        transform:rotateX(360deg) rotateY(360deg);
    }
}

</style>
</head>

<body>

<div class="cube">

<div class="face front">1</div>
<div class="face back">2</div>
<div class="face left">3</div>
<div class="face right">4</div>
<div class="face top">5</div>
<div class="face bottom">6</div>

</div>

</body>
</html>
