<!DOCTYPE html>
<html>
<head>
<title>Grid Gallery</title>
<style>
body{
  margin:0;
  font-family:Arial;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
  gap:10px;
  padding:10px;
}
img{
  width:100%;
  border-radius:10px;
}
</style>
</head>
<body>
<div class="gallery">
  <img src="https://up.yimg.com/ib/th/id/OIP.OOqtfbSfeaAS4j_M9ScLRgHaE8?pid=Api&rs=1&c=1&qlt=95&w=143&h=95" width="50px" height="100px">

  <img src="https://up.yimg.com/ib/th/id/OIP.OOqtfbSfeaAS4j_M9ScLRgHaE8?pid=Api&rs=1&c=1&qlt=95&w=143&h=95" width="50px" height="100px">
  <img src="https://up.yimg.com/ib/th/id/OIP.OOqtfbSfeaAS4j_M9ScLRgHaE8?pid=Api&rs=1&c=1&qlt=95&w=143&h=95" width="50px" height="100px">
  <img src="https://up.yimg.com/ib/th/id/OIP.OOqtfbSfeaAS4j_M9ScLRgHaE8?pid=Api&rs=1&c=1&qlt=95&w=143&h=95" width="50px" height="100px">

</body>
</html>
