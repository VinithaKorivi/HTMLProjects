<html>
    <head>
<style>
.box {
  width: 150px;
  height: 150px;
  background-color: red;
  animation: colorChange 3s infinite;
}
.box1 {
  width: 150px;
  height: 150px;
  background-color: black;
  animation: colorChange 3s infinite;
}

@keyframes colorChange {
  from { background-color: red; }
  to   { background-color: blue; }
}
</style>
</head>
<body>
<div>
<div class="box"></div>
<p>This is the gap between two</p>
<div class="box1"></div>
</div>
</body>
</html>
