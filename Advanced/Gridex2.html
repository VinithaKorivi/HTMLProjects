<html>
<head>
<style>
.container {
  display: grid;
  grid-template-areas:
    "header header"
    "sidebar content"
    "footer footer";
  gap: 10px;
}

.header { grid-area: header; background: lightblue; padding: 20px; }
.sidebar { grid-area: sidebar; background: lightgreen; padding: 20px; }
.content { grid-area: content; background: lightyellow; padding: 20px; }
.footer { grid-area: footer; background: lightcoral; padding: 20px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">Header</div>
  <div class="sidebar">Sidebar</div>
  <div class="content">Content</div>
  <div class="footer">Footer</div>
</div>

</body>
</html>
