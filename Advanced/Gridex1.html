<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: auto auto;
  gap: 10px;
  background-color: lightgray;
  padding: 10px;
}
.item {
  background-color: white;
  padding: 20px;
  text-align: center;
}
</style>
</head>
<body>

<div class="container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>

</body>
</html>
