<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}

.item {
  background: green;
  padding: 80px;
  text-align: center;
}
</style>
</head>
<body>

<div class="container">
  <div class="item">Grid 1</div>
  <div class="item">Grid 2</div>
</div>
</body>
</html>
