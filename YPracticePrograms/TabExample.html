<html>
<head>
    <title>Ex of table</title>
<style>
table {
  width: 60%;
  border-collapse: collapse;
}
th, td {
  border: 1px solid yellow;
  padding: 10px;
}
tr:hover {
  background-color: green;
}
th {
  background-color: rgb(94, 10, 228);
}
</style>
</head>
<body>

<table>
<tr>
  <th>Silk</th>
  <th>Price</th>
</tr>
<tr>
  <td>Cotton</td>
  <td>15000</td>
</tr>
<tr>
  <td>Gold</td>
  <td>55000</td>
</tr>
<tr>
  <td>Iron</td>
  <td>5000</td>
</tr>
<tr>
  <td>Steel</td>
  <td>1000</td>
</tr>
</table>

</body>
</html>
