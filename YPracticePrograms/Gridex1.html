<html>
<head>
<title>Grid Layout</title>
<style>
body{
margin:0;
font-family:Arial;
}
.container{
display:grid;
grid-template-areas:
"header header"
"sidebar content"
"footer footer";
grid-template-columns:250px 1fr;
grid-template-rows:80px 1fr 60px;
height:100vh;
}
header{grid-area:header;background:#333;color:white;
display:flex;align-items:center;justify-content:center;font-size:24px;}
aside{grid-area:sidebar;background:#f4f4f4;padding:20px;}
main{grid-area:content;padding:20px;}
footer{grid-area:footer;background:#333;color:white;
display:flex;align-items:center;justify-content:center;}
.card{
background:lightblue;
margin:10px 0;
padding:15px;
border-radius:8px;
}
</style>
</head>
<body>
<div class="container">
<header>My Website</header>
<aside>
<h3>Menu</h3>
<div class="card">Home</div>
<div class="card">About</div>
<div class="card">Contact</div>
</aside>
<main>
<h2>Welcome</h2>
<p>This is grid content area.</p>
<div class="card">Article 1</div>
<div class="card">Article 2</div>
<div class="card">Article 3</div>
</main>
<footer>Footer</footer>
</div>
</body>
</html>
