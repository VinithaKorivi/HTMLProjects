<html>
<head>
<style>
body{font-family:Arial;background:#eee;margin:0;}
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}
.plan{
background:white;
padding:30px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px gray;
}
.price{font-size:30px;color:green;}
button{
background:#4CAF50;color:white;
padding:10px 20px;border:none;border-radius:5px;
cursor:pointer;
}
button:hover{background:#333;}
</style>
</head>
<body>
<div class="container">
<div class="plan"><h2>Basic</h2><p class="price">₹199</p><p>10GB Storage</p><button>Buy</button></div>
<div class="plan"><h2>Pro</h2><p class="price">₹399</p><p>50GB Storage</p><button>Buy</button></div>
<div class="plan"><h2>Premium</h2><p class="price">₹699</p><p>150GB Storage</p><button>Buy</button></div>
</div>
</body>
</html>
