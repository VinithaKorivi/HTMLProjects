<!DOCTYPE html>
<html>
<head>
<title>Overlapping Boxes</title>
<style>
.container {
    position: relative;
    width: 400px;
    height: 300px;
    /* margin: auto; */
}
.box1 {
    position: absolute;
    top: 200px;
    left: 200px;
    width: 150px;
    height: 150px;
    background: red;
}
.box2 {
    position: absolute;
    top: 100px;
    left: 100px;
    width: 150px;
    height: 150px;
    background: blue;
}
.box3 {
    position: absolute;
    top: 100px;
    left: 300px;
    width: 150px;
    height: 150px;
    background: green;
}
.box4 {
    position: absolute;
    top: 300px;
    left: 100px;
    width: 150px;
    height: 150px;
    background: yellow;
}
.box5 {
    position: absolute;
    top: 300px;
    left: 300px;
    width: 150px;
    height: 150px;
    background: orchid;
}

</style>
</head>
<body>
<div class="container">
    <div class="box1"></div>
    <div class="box2"></div>
     <div class="box3"></div>
      <div class="box4"></div>
       <div class="box5"></div>
</div>
</body>
</html>
