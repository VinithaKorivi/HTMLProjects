<html>
<head>
<style>
.outer{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}
.inner{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.box{
background:lightblue;
padding:20px;
text-align:center;
}
</style>
</head>
<body>
<div class="outer">
<div class="inner">
<div class="box">A</div>
<div class="box">B</div>
<div class="box">C</div>
<div class="box">D</div>
</div>
<div class="box">Main Content</div>
</div>
</body>
</html>
