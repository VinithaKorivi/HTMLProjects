<html>
<head>
<style>
.container{
display:grid;
grid-template-columns:1fr 1fr;
height:100vh;
}
.left{
background:url("https://picsum.photos/600") center/cover;
}
.right{
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}
input{
display:block;
margin:10px;
padding:10px;
width:250px;
}
button{
padding:10px 20px;
background:#4CAF50;
color:white;border:none;
}
</style>
</head>
<body>
<div class="container">
<div class="left"></div>
<div class="right">
<h2>Login</h2>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button>Login</button>
</div>
</div>
</body>
</html>
