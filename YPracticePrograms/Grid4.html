<html>
<head>
<style>
body{margin:0;font-family:Arial;}
.container{
display:grid;
grid-template-columns:220px 1fr;
grid-template-rows:70px 1fr;
height:100vh;
}
.sidebar{background:#111;color:white;padding:20px;}
.header{background:#4CAF50;color:white;display:flex;align-items:center;justify-content:center;}
.main{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
background:#f4f4f4;
}
.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 5px gray;
text-align:center;
}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<h2>Dashboard</h2>
<p>Home</p><p>Users</p><p>Settings</p>
</div>
<div>
<div class="header">Admin Panel</div>
<div class="main">
<div class="card">Users</div>
<div class="card">Revenue</div>
<div class="card">Orders</div>
<div class="card">Reports</div>
</div>
</div>
</div>
</body>
</html>
