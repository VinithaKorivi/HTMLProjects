<html>
    <head>
        <title>Function types</title>
    </head>
    <body>
        <script>
             table();
         function table(){
         let msg="Happy birthday";
         console.log(msg);
        }
        table();
         let greetmsg=function(){
              greetmsg="Wish you happy birthday";
              console.log(greetmsg);
        }
        greetmsg();
        let greetings=()=>{
            greeting="happy married life";
            console.log(greeting)
        }
        greetings();
        </script>
    </body>
</html>
