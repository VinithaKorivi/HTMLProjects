<html>
    <head>
        <title>About falsy values</title>
    </head>
    <body>
        <script>
            let a=undefined;
            if(!a){
                console.log("i am a falsy value")
            }else{
                console.log("I am not a falsy value")
            }
             let b=null;
            if(!b){
                console.log("i am a falsy value")
            }else{
                console.log("I am not a falsy value")
            }
             let c=NaN;
            if(!c){
                console.log("i am a falsy value")
            }else{
                console.log("I am not a falsy value")
            }
            let d="";
            if(!d){
                console.log("i am a falsy value")
            }else{
                console.log("I am not a falsy value")
            }
             let e=false;
            if(!e){
                console.log("i am a falsy value")
            }else{
                console.log("I am not a falsy value")
            }
             let f=0;
            if(!f){
                console.log("i am a falsy value")
            }else{
                console.log("I am not a falsy value")
            }
        </script>
    </body>
</html>
