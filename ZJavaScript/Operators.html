<html>
    <head>
        <title>Operators in JavaScript</title>
    </head>
    <body>
        <script>
            console.log('Arithmetic') 
            let a=20, b=10;
            console.log(a+b);
            console.log(a-b)
             console.log(a*b);
              console.log(a/b);
               console.log(a%b);
             console.log('Assignment') 
            let c=3;
             console.log(++c)
              console.log(--c)
              console.log(c++)
              console.log(c--)
            console.log(c+=4)
            console.log(c-=4)
            console.log("comparison")
            let d="2", e=2;
             console.log(d==e)
              console.log(d===e)
              console.log(a<b);
              console.log(a>b);
              console.log(a<=b);
              console.log(a>=b);
              console.log("small program regarding 2,3= oper")
              let x=80;  y='Student';
              if(x===y){
                console.log("x and y are same")
              }else{
                console.log("x and y are not same")
              }
              console.log("logical operators")
              let q=45, t=89;
              console.log(q&t)
              console.log(q,typeof q)
              console.log(!q)
              console.log("ternary")
              console.log(a<b?"True":"false")
        </script>
    </body>
