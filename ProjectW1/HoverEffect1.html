<html>

<head>
    <title></title>
</head>
<style>
    body{
        margin: 50px;
    }
    .btn{
        position: relative;
        /* overflow: hidden; */
        background-color: blue;
        color: white;
        padding: 10px;
        width: 200px;
        border-radius: 10px;
        margin: 20px;
        transition: all 0.4s ease;
    }
    .btn:hover{
        transform: scale(1.1);
        background-color: green;
        box-shadow: 0px 0px 10px 5px black;
    }
    .btn:hover::after{
        width: 200px; 
        height: 200px;
    }
    .btn::after{
        content: "";
        position: absolute;
        background-color: rgb(16, 19, 22);
        width: 0;
        height: 0;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: 0.9s;
    }
    .btn span {
  position: relative;
  z-index: 1;
}
</style>
<body>
    <div class="container">
        <button class="btn"><span>Log In</span></button>
        <button class="btn"><span>Submit</span></button>
        <button class="btn"><span>Cancel</span></button>
    </div>
</body>

</html>
