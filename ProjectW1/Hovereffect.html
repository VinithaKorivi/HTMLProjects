<html>

<head>
    <title></title>
</head>
<style>
    body{
        margin: 50px;
    }
    .btn{
        background-color: blue;
        color: white;
        padding: 10px;
        width: 100px;
        border-radius: 10px;
        margin: 20px;
        transition: all 0.4s ease;
    }
    .btn:hover{
        transform: scale(1.1);
        background-color: green;
        box-shadow: 0px 0px 10px 5px black;
    }
    .btn:hover::after{
        width: 200px; 
        height: 200px;
    }
</style>
<body>
    <div class="container">
        <button class="btn"><span>Log In</span></button>
        <button class="btn"><span>Submit</span></button>
        <button class="btn"><span>Cancel</span></button>
    </div>
</body>

</html>
