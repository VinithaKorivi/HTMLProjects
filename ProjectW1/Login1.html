<html>
    <head>
    </head>
    <style>
        .container{
            background: linear-gradient(to right, rgb(15, 196, 196), rgb(222, 158, 41) );
            height: 300px;
            width: 350px;
            margin: 50px 200px;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            border-radius: 20px;
        }
        input, button{
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
        }
        button{
            background-color: red;
            color: white;
        }
    </style>
    <body>
        <div class="container">
        <h1>Login</h1>
        <input type="text" placeholder="Username">
        <input type="Password" placeholder="Password">
        <button>Login</button>
        </div>
    </body>
</html>
