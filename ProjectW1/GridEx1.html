<html>
    <head>
        <title>Fractions</title>
        <style>
           .outer{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
           } 
           .inner{
            display: grid;
            grid-template-columns: 1fr 1fr;
           }
           .total{
            color: black;
            background-color: chartreuse;
            padding: 20px;
            margin: 10px;
            text-align: center;
            border: 2px solid black;
           }
           .total:hover{
            box-shadow: 0px 0px 2px 5px green;
           }
        </style>
    </head>
    <body>
        <div class="outer">
            <div class="inner">
                <div class="total">Fraction - 1</div>
                <div class="total">Fraction - 2</div>
                <div class="total">Fraction - 3</div>
                <div class="total">Fraction - 4</div>
            </div>
            <div class="total">four in one</div>
        </div>
    </body>
</html>
