<html>
<head>
    <meta charset="UTF-8">
    <title>Amazon Ex</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
            gap: 20px;
        }
        .card{
            background-color: palegreen;
            padding: 20px;
            align-items: center;
            box-shadow: 0px 0px 10px red;
            transition: 0.3s;
            text-align: center;
        }
        .card:hover{
            transform: scale(1.08);
        }
        img{
            width:80%;
            border-radius:10px;
            height: 200px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="card"><img src="https://tse1.mm.bing.net/th/id/OIP.XbtwtW1CsAV62tTzmpIAzAHaHa?pid=Api&P=0&h=180" alt="Rose Picture" >
            <h3>Red Rose</h3>
            <p>₹500</p><button>Buy</button>
        </div>
        <div class="card">
            <img src="https://tse1.mm.bing.net/th/id/OIP.dnLvnDC6TgRStNvHXEoszgHaE7?pid=Api&P=0&h=180" alt="Rose Picture" >
            <h3>white and pink Rose</h3> <p>₹1000</p><button>Buy</button>
        </div>
        <div class="card">
           <img src="https://tse3.mm.bing.net/th/id/OIP.FDahWsPjw1Yxs6ePLA6uSAHaFi?pid=Api&P=0&h=180" alt="Rose Picture" >
            <h3>yellow Rose</h3><p>₹1500</p><button>Buy</button>
        </div>
        <div class="card">
            <img src="https://tse1.mm.bing.net/th/id/OIP.6Z5qbDBOqiT15GnZd23hvAHaHO?pid=Api&P=0&h=180" alt="Rose Picture" >
            <h3>blue Rose</h3><p>₹2000</p><button>Buy</button>
        </div>
    </div>
</body>

</html>
